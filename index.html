<style>
:root{color-scheme:light;--orange:#f47700;--deep:#d85f00;--cream:#fff4e8;--ink:#242424;--muted:#737373;--line:#eee5dc;--bg:#fffaf5;--green:#16794a;--red:#b42318}

header{position:sticky;top:0;z-index:5;background:linear-gradient(110deg,var(--deep),var(--orange));color:white;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 14px #9b43002b}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}
.metric{background:linear-gradient(145deg,#fff8f0,#fff);border:1px solid #f4e4d4;border-radius:12px;padding:12px;text-align:center}
.metric strong{display:block;font-size:25px;color:var(--deep);line-height:1.25}.metric span{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.total{font-size:32px;font-weight:850;color:var(--deep);text-align:center}
.frow{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1ece7;padding:7px 0}.frow label{flex:1;font-size:14px;font-weight:650}.frow input{width:105px;text-align:center;font-size:18px;font-weight:700;padding:7px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #f0ebe6}th{background:var(--cream);font-weight:800}td:first-child,th:first-child{text-align:right}tr:last-child td{border-bottom:0}.area-row td{background:#2a2928;color:white;font-weight:800}
.notice{padding:11px 12px;border-radius:10px;background:var(--cream);border-right:4px solid var(--orange);font-size:13px;margin:10px 0}

.hidden{display:none!important}.pill{display:inline-block;border-radius:30px;padding:3px 9px;font-size:11px;background:#f1f1f1;color:#555}.pill.ok{background:#e7f6ed;color:var(--green)}.pill.no{background:#fff0ee;color:var(--red)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

<body>
<header><div><div class="brand">مبيعات الفروع اليومية</div><div class="subbrand">تسجيل المبيعات اليومية للفرع</div></div><span id="nav"></span></header>
<main id="app"><div class="card">جاري التحميل...</div></main>
<script>
const SUPABASE_URL='https://fjhjqrgolqqtaokrlezd.supabase.co';
const SUPABASE_KEY='sb_publishable_6cLV7KQHG3RNeAenIUcKFg_qpWHumZq';
const TYPES=[['alo','ALO'],['control','Control'],['postpaid','Postpaid'],['dataline','Data line'],['corporate','Corporate'],['mnp','MNP'],['migration','Migration'],['adsl','ADSL'],['simswap','SIM Swap'],['cleansing','Data Cleansing & Gathering']];
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const shift=(date,n)=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const total=v=>TYPES.reduce((s,[k])=>s+(Number(v?.[k])||0),0);
const emptyValues=()=>Object.fromEntries(TYPES.map(([k])=>[k,0]));
let branch=JSON.parse(localStorage.getItem('ac_branch')||'null');
let managerPassword=sessionStorage.getItem('ac_manager_password')||'';
let managerData=null;
async function rpc(name,args={}){
 const response=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
 const data=await response.json().catch(()=>null);
 if(!response.ok)throw new Error(data?.message||data?.details||'تعذر الاتصال بالخدمة');
 if(data&&data.ok===false)throw new Error(errorText(data.error));
 return data;
}
function errorText(code){return ({wrong:'الرقم السري غير صحيح',locked:'تم إيقاف المحاولة مؤقتًا بسبب محاولات خاطئة',no_branch:'الفرع غير متاح',bad_pin:'الرقم السري لازم يكون من 4 إلى 8 أرقام',bad_name:'اسم الفرع غير صحيح',duplicate:'الفرع مسجل بالفعل',bad_day:'التاريخ غير صحيح',day_locked:'تعديل الأيام مسموح لآخر 3 أيام فقط',period_closed:'الفترة اتقفلت بعد التسليم',bad_number:'راجع الأرقام المدخلة',weak_password:'كلمة المرور لازم تكون 6 أحرف على الأقل'})[code]||code||'حدث خطأ غير متوقع'}
function nav(){$('#nav').innerHTML=''}
function showError(id,e){const el=$(id);if(el)el.textContent=e.message||String(e)}
function renderBranchPicker(message=''){
 branch=null;localStorage.removeItem('ac_branch');
 app.innerHTML=`<section class="card"><h2>اختيار الفرع</h2><p class="muted">اختار فرعك وسجّل الرقم السري المخصص له.</p>
 <div class="field"><label>المنطقة والفرع</label><select id="branchSelect"><option value="">جاري تحميل الفروع...</option></select></div>
 <div class="field"><label>الرقم السري للفرع</label><input id="branchPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="من 4 إلى 8 أرقام"></div>
 <button id="branchLogin">دخول الفرع</button><div class="error" id="pickError">${esc(message)}</div></section>
 <section class="card"><h3>معلومة</h3><p class="muted">لو احتجت مساعدة في بيانات الفرع، تواصل مع مسؤول المتابعة.</p></section>`;
 loadBranches();
 $('#branchLogin').onclick=async()=>{const id=$('#branchSelect').value,pin=$('#branchPin').value.trim();if(!id||!pin){$('#pickError').textContent='اختار الفرع واكتب الرقم السري';return}
 const btn=$('#branchLogin');btn.disabled=true;try{const result=await rpc('ac_login',{p_branch:id,p_pin:pin});const opt=$('#branchSelect').selectedOptions[0];branch={id,name:result.name||opt.dataset.name,area:opt.dataset.area};localStorage.setItem('ac_branch',JSON.stringify(branch));sessionStorage.setItem('ac_branch_pin',pin);renderBranch()}catch(e){showError('#pickError',e)}finally{btn.disabled=false}};
}
async function loadBranches(){try{const list=await rpc('ac_list_branches');$('#branchSelect').innerHTML='<option value="">اختار الفرع</option>'+list.map(b=>`<option value="${esc(b.id)}" data-name="${esc(b.name)}" data-area="${esc(b.area)}">${esc(b.name)}</option>`).join('')}catch(e){showError('#pickError',e)}}
function renderFields(values={}){$('#fields').innerHTML='<div class="grid"><div class="field"><label for="v_contracts_count">عدد العقود</label><input id="v_contracts_count" type="number" inputmode="numeric" min="0" max="100000" step="1" value="'+(Number(values.contracts_count)||0)+'"></div><div class="field"><label for="v_sales_count">عدد المبيعات</label><input id="v_sales_count" type="number" inputmode="numeric" min="0" max="100000" step="1" value="'+(Number(values.sales_count)||0)+'"></div></div>'+TYPES.map(([k,label])=>'<div class="frow"><label for="v_'+k+'">'+label+'</label><input id="v_'+k+'" type="number" inputmode="numeric" min="0" max="100000" step="1" value="'+(Number(values[k])||'')+'" placeholder="0"></div>').join('');TYPES.forEach(([k])=>$('#v_'+k).addEventListener('input',calcTotal));calcTotal()}
function readFields(){const v={contracts_count:Math.max(0,Math.min(100000,Math.trunc(Number($('#v_contracts_count').value)||0))),sales_count:Math.max(0,Math.min(100000,Math.trunc(Number($('#v_sales_count').value)||0)))};TYPES.forEach(([k])=>v[k]=Math.max(0,Math.min(100000,Math.trunc(Number($('#v_'+k).value)||0))));return v}
function calcTotal(){const el=$('#totalNow');if(el)el.textContent=total(readFields())}
function renderBranch(){
 if(!branch||!sessionStorage.getItem('ac_branch_pin'))return renderBranchPicker();
 const t=today();app.innerHTML=`<section class="card"><div class="row"><div><h2>${esc(branch.name)}</h2></div><button class="tiny secondary" id="switchBranch">تغيير الفرع</button></div></section>
 <section class="card"><div class="field"><label for="entryDay">تاريخ التسجيل</label><input id="entryDay" type="date" value="${t}" min="${shift(t,-2)}" max="${t}"></div><div id="fields"></div>
 <div class="notice row"><b>إجمالي اليوم</b><strong class="total" id="totalNow">0</strong></div>
 <div class="actions"><button id="saveDay">حفظ البيانات</button><button class="light" id="printContract">طباعة كشف العقود A4</button></div><div class="success" id="saveMessage"></div><div class="error" id="saveError"></div></section>
 <section class="card"><div class="section-title"><h3 id="periodTitle">إجمالي الفترة الحالية</h3></div><div class="table-wrap"><table><thead><tr>${TYPES.map(([,l])=>'<th>'+l+'</th>').join('')}<th>عدد العقود</th><th>عدد المبيعات</th><th>الإجمالي</th></tr></thead><tbody id="periodValues"></tbody></table></div></section>
 `;
 $('#switchBranch').onclick=()=>{sessionStorage.removeItem('ac_branch_pin');renderBranchPicker()};
 $('#entryDay').onchange=()=>{fillDay();renderPeriod()};
 $('#saveDay').onclick=saveBranchDay;$('#printContract').onclick=printContractSheet;
 loadBranchDays();
}
let branchDays=[],closedPeriods=[];
async function loadBranchDays(){try{const pin=sessionStorage.getItem('ac_branch_pin');const d=await rpc('ac_get_days',{p_branch:branch.id,p_pin:pin});branchDays=d.days||[];closedPeriods=d.closed||[];fillDay();renderPeriod();}catch(e){showError('#saveError',e);if(e.message.includes('الرقم السري')){sessionStorage.removeItem('ac_branch_pin');renderBranchPicker(e.message)}}}
function fillDay(){const d=branchDays.find(x=>x.day===$('#entryDay').value);renderFields(d?.v||{});$('#saveMessage').textContent=d?'توجد بيانات محفوظة لهذا اليوم ويمكن تعديلها':''}

function periodBounds(monthValue,half){const [y,m]=monthValue.split('-').map(Number),start=half==='first'?1:16,end=half==='first'?15:30;return {start:new Date(y,m-1,start),end:new Date(y,m-1,end),from:y+'-'+String(m).padStart(2,'0')+'-'+String(start).padStart(2,'0'),to:y+'-'+String(m).padStart(2,'0')+'-'+String(end).padStart(2,'0')}}
function printContractSheet(){
 const date=$('#entryDay').value||today(),month=date.slice(0,7),half=Number(date.slice(8))<=15?'first':'second',range=periodBounds(month,half);
 const rows=branchDays.filter(x=>x.day>=range.from&&x.day<=range.to),totals=emptyValues();
 rows.forEach(r=>TYPES.forEach(([k])=>totals[k]+=Number(r.v?.[k])||0));
 const fmt=d=>d.getDate()+'/'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+'/'+d.getFullYear();
 const values=TYPES.map(([k,label])=>({label,value:totals[k]}));
 const totalContracts=values.reduce((s,x)=>s+x.value,0);
 const print=document.createElement('div');print.id='contractPrintSheet';print.innerHTML=`
 <div class="paper-frame"><div class="paper-head"><div class="paper-title">AlSafy Retail CIF</div>
 <div class="paper-meta"><div><b>Shop Name:</b> ${esc(branch.name)}</div><div><b>Period from:</b> ${fmt(range.start)} <b>to</b> ${fmt(range.end)}</div><div><b>Manager Signature:</b> <span class="write-line"></span></div><div><b>Shop Code &amp; Stamp:</b> <span class="write-line"></span></div></div></div>
 <table class="paper-table"><thead><tr><th>Type</th><th>Contracts</th></tr></thead><tbody>${values.map(x=>'<tr><td>'+esc(x.label)+'</td><td>'+(x.value===0?'X':x.value)+'</td></tr>').join('')}<tr class="paper-total"><td>Total</td><td>${totalContracts}</td></tr></tbody></table>
 <div class="paper-sign"><div><b>تاريخ الاستلام:</b><span></span></div><div><b>إمضاء المستلم:</b><span></span></div></div></div>`;
 document.body.appendChild(print);window.print();setTimeout(()=>print.remove(),700);
}

function renderPeriod(){const date=$('#entryDay').value||today(),day=Number(date.slice(8)),start=date.slice(0,8)+(day<=15?'01':'16'),end=date.slice(0,8)+(day<=15?'15':new Date(Date.UTC(Number(date.slice(0,4)),Number(date.slice(5,7)),0)).getUTCDate());const vals=emptyValues();branchDays.filter(x=>x.day>=start&&x.day<=end).forEach(x=>TYPES.forEach(([k])=>vals[k]+=Number(x.v?.[k])||0));$('#periodTitle').textContent='إجمالي الفترة '+(day<=15?'1–15':'16–نهاية الشهر')+' · '+date.slice(0,7);const contracts=branchDays.filter(x=>x.day>=start&&x.day<=end).reduce((s,x)=>s+(Number(x.v?.contracts_count)||0),0),sales=branchDays.filter(x=>x.day>=start&&x.day<=end).reduce((s,x)=>s+(Number(x.v?.sales_count)||0),0);$('#periodValues').innerHTML='<tr>'+TYPES.map(([k])=>'<td>'+vals[k]+'</td>').join('')+'<td>'+contracts+'</td><td>'+sales+'</td><td><b>'+total(vals)+'</b></td></tr>'}
async function saveBranchDay(){const date=$('#entryDay').value,t=today(),pin=sessionStorage.getItem('ac_branch_pin');if(date>t||date<shift(t,-2)){showError('#saveError',{message:'يمكن تعديل آخر 3 أيام فقط'});return}const periodStart=date.slice(0,8)+(Number(date.slice(8))<=15?'01':'16');if(closedPeriods.includes(periodStart)){showError('#saveError',{message:'الفترة تم إغلاقها بعد التسليم'});return}const btn=$('#saveDay');btn.disabled=true;$('#saveError').textContent='';try{await rpc('ac_save_day',{p_branch:branch.id,p_pin:pin,p_day:date,p_v:readFields()});await loadBranchDays();$('#saveMessage').textContent='تم حفظ البيانات بنجاح ✓'}catch(e){showError('#saveError',e)}finally{btn.disabled=false}}
function renderManagerLogin(message=''){managerPassword='';sessionStorage.removeItem('ac_manager_password');app.innerHTML=`<section class="card"><h2>دخول المدير</h2><p class="muted">أدخل كلمة مرور المدير لعرض التقارير وإدارة الفروع.</p><div class="field"><label>كلمة المرور</label><input id="managerPassword" type="password" autocomplete="current-password"></div><button id="managerLogin">دخول</button><div class="error" id="managerError">${esc(message)}</div></section>`;$('#managerLogin').onclick=managerLogin;$('#managerPassword').onkeydown=e=>{if(e.key==='Enter')managerLogin()}}
async function managerLogin(){const p=$('#managerPassword').value,btn=$('#managerLogin');btn.disabled=true;try{await rpc('ac_mgr_check',{p_password:p});managerPassword=p;sessionStorage.setItem('ac_manager_password',p);renderManager()}catch(e){showError('#managerError',e)}finally{btn.disabled=false}}
function managerCall(name,args={}){return rpc(name,{p_password:managerPassword,...args})}
function renderManager(){if(!managerPassword)return renderManagerLogin();const t=today();app.innerHTML=`<section class="card"><div class="row"><div><h2>لوحة متابعة الفروع</h2><div class="muted">تقارير المبيعات وإدارة الفروع</div></div><button class="tiny secondary" id="managerLogout">خروج</button></div></section>
 <section class="card"><h3>الفترة المطلوبة</h3><div class="grid"><div class="field"><label>من</label><input id="fromDate" type="date" value="${t.slice(0,7)}-01"></div><div class="field"><label>إلى</label><input id="toDate" type="date" value="${t}"></div></div><button id="refreshReport">عرض التقرير</button><div class="error" id="managerError"></div></section>
 <div id="managerReport"></div>
 <section class="card"><h3>إدارة الفروع</h3><div class="grid"><div class="field"><label>اسم الفرع</label><input id="branchName" placeholder="اسم الفرع"></div><div class="field"><label>المنطقة</label><input id="branchArea" placeholder="المنطقة"></div></div><div class="field"><label>رقم سري للفرع (4–8 أرقام)</label><input id="branchNewPin" inputmode="numeric" maxlength="8" placeholder="إلزامي عند الإضافة"></div><input id="branchId" type="hidden"><div class="actions"><button id="saveBranch">إضافة فرع</button><button class="light" id="clearBranch">مسح الحقول</button></div><div class="success" id="branchMessage"></div><div class="error" id="branchError"></div><div id="branchList"></div></section>
 <section class="card"><div class="section-title"><h3>سجل التعديلات</h3><button class="tiny light" id="loadAudit">عرض آخر التعديلات</button></div><div id="auditList" class="muted">اضغط لعرض سجل التعديلات.</div></section>`;
 $('#managerLogout').onclick=()=>renderManagerLogin();$('#refreshReport').onclick=loadManagerReport;$('#saveBranch').onclick=saveManagerBranch;$('#clearBranch').onclick=clearBranchForm;$('#loadAudit').onclick=loadAudit;loadManagerReport()}
async function loadManagerReport(){const from=$('#fromDate').value,to=$('#toDate').value;if(!from||!to||from>to){showError('#managerError',{message:'راجع تاريخ بداية ونهاية التقرير'});return}try{const [data,todayData]=await Promise.all([managerCall('ac_mgr_data',{p_from:from,p_to:to}),managerCall('ac_mgr_data',{p_from:today(),p_to:today()})]);data.todayEntries=todayData.entries||[];managerData=data;drawManagerReport(data,from,to)}catch(e){showError('#managerError',e)}}
function drawManagerReport(data,from,to){const entries=data.entries||[],branches=data.branches||[],todayValue=data.today||today(),byId={};branches.forEach(b=>byId[b.id]={...b,v:emptyValues(),submittedToday:false});entries.forEach(r=>{const b=byId[r.branch_id];if(!b)return;TYPES.forEach(([k])=>b.v[k]+=Number(r.v?.[k])||0);});(data.todayEntries||[]).forEach(r=>{if(byId[r.branch_id])byId[r.branch_id].submittedToday=true});const all=Object.values(byId),totals=emptyValues();all.forEach(b=>TYPES.forEach(([k])=>totals[k]+=b.v[k]));const areas={};all.forEach(b=>(areas[b.area||'بدون منطقة']??=[]).push(b));const missing=all.filter(b=>!b.submittedToday);
 let html=`<section class="card"><div class="muted">${esc(from)} ← ${esc(to)}</div><div class="total">${total(totals)}</div><div class="muted" style="text-align:center">إجمالي كل الفروع · ${all.length} فرع</div><div class="grid" style="margin-top:12px">${TYPES.map(([k,l])=>`<div class="metric"><strong>${totals[k]}</strong><span>${l}</span></div>`).join('')}</div></section>
 <section class="card"><h3>حالة تسليم اليوم</h3><div class="notice">${missing.length?('لم تسجل '+missing.length+' فروع أرقام اليوم: '+missing.map(b=>esc(b.area)+' - '+esc(b.name)).join('، ')):'كل الفروع سجلت أرقام اليوم ✓'}</div></section>
 <section class="card"><h3>تفاصيل الفروع</h3><div class="table-wrap"><table><thead><tr><th>الفرع</th>${TYPES.map(([,l])=>'<th>'+l+'</th>').join('')}<th>الإجمالي</th><th>إجراء</th></tr></thead><tbody>${Object.keys(areas).sort().map(area=>{const group=areas[area],av=emptyValues();group.forEach(b=>TYPES.forEach(([k])=>av[k]+=b.v[k]));return '<tr class="area-row"><td>'+esc(area)+'</td>'+TYPES.map(([k])=>'<td>'+av[k]+'</td>').join('')+'<td>'+total(av)+'</td><td></td></tr>'+group.map(b=>'<tr><td>'+esc(b.name)+'<br><span class="pill '+(b.submittedToday?'ok':'no')+'">'+(b.submittedToday?'سلّم اليوم':'لم يسلّم')+'</span></td>'+TYPES.map(([k])=>'<td>'+b.v[k]+'</td>').join('')+'<td><b>'+total(b.v)+'</b></td><td><button class="tiny light" data-edit="'+esc(b.id)+'">تعديل</button></td></tr>').join('')}).join('')||'<tr><td colspan="13">لا توجد فروع مسجلة</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:10px"><button class="light" id="exportCsv">تصدير CSV</button></div></section>
 <section class="card" id="managerEditCard"><h3>تعديل بيانات فرع</h3><p class="muted">اختار الفرع من زر تعديل في الجدول لعرض النموذج هنا.</p><div id="managerEdit"></div></section>
 <section class="card"><h3>الفترات المسلّمة</h3><div id="handoverList" class="muted">لا توجد بيانات تسليم ضمن الفترة.</div></section>`;
 $('#managerReport').innerHTML=html;renderBranchList(branches);document.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>editManagerEntry(btn.dataset.edit));$('#exportCsv').onclick=()=>exportReport(all,from,to);drawHandovers(data.handovers||[])}
function exportReport(rows,from,to){const headers=['المنطقة','الفرع',...TYPES.map(x=>x[1]),'الإجمالي'];const lines=[headers,...rows.map(b=>[b.area,b.name,...TYPES.map(([k])=>b.v[k]),total(b.v)])];const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='branch-sales-'+from+'-'+to+'.csv';a.click();URL.revokeObjectURL(a.href)}
function editManagerEntry(id){const b=managerData?.branches?.find(x=>x.id===id);if(!b)return;const date=$('#toDate').value;$('#managerEdit').innerHTML=`<div class="notice">${esc(b.area)} · ${esc(b.name)}</div><div class="field"><label>التاريخ</label><input type="date" id="mgrDay" value="${date}" max="${today()}"></div><div id="mgrFields"></div><button id="mgrSaveDay">حفظ تعديل المدير</button><div class="error" id="mgrEditError"></div><div class="success" id="mgrEditSuccess"></div>`;const row=(managerData.entries||[]).find(x=>x.branch_id===id&&x.day===date);$('#mgrFields').innerHTML=TYPES.map(([k,l])=>`<div class="frow"><label>${l}</label><input type="number" min="0" max="100000" id="m_${k}" value="${Number(row?.v?.[k])||0}"></div>`).join('');$('#mgrDay').onchange=()=>{const r=(managerData.entries||[]).find(x=>x.branch_id===id&&x.day===$('#mgrDay').value);TYPES.forEach(([k])=>$('#m_'+k).value=Number(r?.v?.[k])||0)};$('#mgrSaveDay').onclick=async()=>{const v={};TYPES.forEach(([k])=>v[k]=Math.max(0,Math.min(100000,Math.trunc(Number($('#m_'+k).value)||0))));try{await managerCall('ac_mgr_save_day',{p_branch:id,p_day:$('#mgrDay').value,p_v:v});$('#mgrEditSuccess').textContent='تم حفظ التعديل';await loadManagerReport()}catch(e){showError('#mgrEditError',e)}}}
function drawHandovers(items){$('#handoverList').innerHTML=items.length?items.map(h=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #eee"><span>${esc(h.period_start)} · ${esc(h.branch_id)}</span><span class="pill ok">تم الاستلام</span></div>`).join(''):'لا توجد فترات مسلّمة ضمن النطاق.'}
function renderBranchList(branches){$('#branchList').innerHTML='<h3 style="margin-top:16px">الفروع المسجلة</h3>'+ (branches.length?branches.map(b=>'<div class="row" style="padding:9px 0;border-bottom:1px solid #eee"><div><b>'+esc(b.name)+'</b><div class="muted">'+esc(b.area)+' · '+(b.has_pin?'رقم سري مفعّل':'بدون رقم سري')+'</div></div><div class="actions"><button class="tiny light" data-branch-edit="'+esc(b.id)+'">تعديل</button><button class="tiny danger" data-branch-archive="'+esc(b.id)+'">إيقاف</button></div></div>').join(''):'<p class="muted">لا توجد فروع مسجلة.</p>');document.querySelectorAll('[data-branch-edit]').forEach(btn=>btn.onclick=()=>{const b=branches.find(x=>x.id===btn.dataset.branchEdit);if(!b)return;$('#branchId').value=b.id;$('#branchName').value=b.name;$('#branchArea').value=b.area;$('#branchNewPin').value='';$('#saveBranch').textContent='حفظ التعديلات';$('#branchMessage').textContent='اترك الرقم السري فارغًا للاحتفاظ بالرقم الحالي';});document.querySelectorAll('[data-branch-archive]').forEach(btn=>btn.onclick=async()=>{const b=branches.find(x=>x.id===btn.dataset.branchArchive);if(!b||!confirm('إيقاف فرع '+b.name+'؟ لن يظهر في شاشة تسجيل الدخول.'))return;try{await managerCall('ac_mgr_archive_branch',{p_branch:b.id});await loadManagerReport()}catch(e){showError('#branchError',e)}})}
async function saveManagerBranch(){const id=$('#branchId').value||null,name=$('#branchName').value.trim(),area=$('#branchArea').value.trim(),pin=$('#branchNewPin').value.trim();try{await managerCall('ac_mgr_save_branch',{p_id:id,p_name:name,p_area:area,p_pin:pin||null});$('#branchMessage').textContent='تم حفظ بيانات الفرع';clearBranchForm();await loadManagerReport()}catch(e){showError('#branchError',e)}}
function clearBranchForm(){['branchId','branchName','branchArea','branchNewPin'].forEach(id=>$('#'+id).value='');$('#saveBranch').textContent='إضافة فرع';$('#branchMessage').textContent=''}
async function loadAudit(){try{const data=await managerCall('ac_mgr_audit',{p_limit:30});$('#auditList').innerHTML=(data.rows||[]).map(r=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${esc(r.name)}</b> · ${esc(r.day)}<div class="muted">بواسطة ${esc(r.actor)} · ${esc(new Date(r.at).toLocaleString('ar-EG'))}</div></div>`).join('')||'لا توجد تعديلات مسجلة'}catch(e){showError('#auditList',e)}}

let viewerPassword=sessionStorage.getItem('ac_viewer_password')||'';
let viewerData=null;
function renderViewerLogin(message=''){viewerPassword='';sessionStorage.removeItem('ac_viewer_password');app.innerHTML=`<section class="card"><h2>متابعة مستر عبدالرحمن</h2><p class="muted">لوحة عرض فقط لمتابعة أداء الفروع السبعة. لا تسمح بتعديل أو حذف أي بيانات.</p><div class="field"><label>كلمة مرور المتابعة</label><input id="viewerPassword" type="password" autocomplete="current-password"></div><button id="viewerLogin">دخول لوحة المتابعة</button><div class="error" id="viewerError">${esc(message)}</div></section>`;$('#viewerLogin').onclick=viewerLogin;$('#viewerPassword').onkeydown=e=>{if(e.key==='Enter')viewerLogin()}}
async function viewerLogin(){const p=$('#viewerPassword').value,btn=$('#viewerLogin');btn.disabled=true;try{await rpc('ac_viewer_check',{p_password:p});viewerPassword=p;sessionStorage.setItem('ac_viewer_password',p);renderViewer()}catch(e){showError('#viewerError',e)}finally{btn.disabled=false}}
async function viewerCall(from,to){return rpc('ac_viewer_data',{p_password:viewerPassword,p_from:from,p_to:to})}
function renderViewer(){if(!viewerPassword)return renderViewerLogin();const t=today();app.innerHTML=`<section class="card"><div class="row"><div><h2>لوحة متابعة مستر عبدالرحمن</h2><div class="muted">صلاحية مشاهدة فقط · ${7} فروع</div></div><button class="tiny secondary" id="viewerLogout">خروج</button></div><div class="notice">هذه الصفحة للمتابعة والتقارير فقط، ولا تحتوي على أدوات تعديل أو حذف.</div></section>
<section class="card"><h3>الفترة المطلوبة</h3><div class="grid"><div class="field"><label>من</label><input id="viewerFrom" type="date" value="${t.slice(0,7)}-01"></div><div class="field"><label>إلى</label><input id="viewerTo" type="date" value="${t}"></div></div><button id="viewerRefresh">تحديث التقرير</button><div class="error" id="viewerError"></div></section><div id="viewerReport"></div>`;
$('#viewerLogout').onclick=()=>renderViewerLogin();$('#viewerRefresh').onclick=loadViewerReport;loadViewerReport()}
async function loadViewerReport(){const from=$('#viewerFrom').value,to=$('#viewerTo').value;if(!from||!to||from>to){showError('#viewerError',{message:'راجع تاريخ بداية ونهاية التقرير'});return}const btn=$('#viewerRefresh');btn.disabled=true;try{const [data,todayData]=await Promise.all([viewerCall(from,to),viewerCall(today(),today())]);viewerData={...data,todayEntries:todayData.entries||[]};drawViewerReport(viewerData,from,to)}catch(e){showError('#viewerError',e);if((e.message||'').includes('الرقم السري'))renderViewerLogin(e.message)}finally{btn.disabled=false}}
function drawViewerReport(data,from,to){const branches=data.branches||[],entries=data.entries||[],todayEntries=data.todayEntries||[],byId={};branches.forEach(b=>byId[b.id]={...b,v:emptyValues(),submittedToday:false});entries.forEach(r=>{const b=byId[r.branch_id];if(!b)return;TYPES.forEach(([k])=>b.v[k]+=Number(r.v?.[k])||0)});todayEntries.forEach(r=>{if(byId[r.branch_id])byId[r.branch_id].submittedToday=true});const all=Object.values(byId),totals=emptyValues();all.forEach(b=>TYPES.forEach(([k])=>totals[k]+=b.v[k]));const missing=all.filter(b=>!b.submittedToday);const daily={};entries.forEach(r=>{daily[r.day]??=emptyValues();TYPES.forEach(([k])=>daily[r.day][k]+=Number(r.v?.[k])||0)});const sortedDays=Object.keys(daily).sort().reverse();$('#viewerReport').innerHTML=`<section class="card"><div class="muted">${esc(from)} ← ${esc(to)}</div><div class="total">${total(totals)}</div><div class="muted" style="text-align:center">إجمالي مبيعات الفروع · ${all.length} فرع</div><div class="grid" style="margin-top:12px">${TYPES.map(([k,l])=>`<div class="metric"><strong>${totals[k]}</strong><span>${l}</span></div>`).join('')}</div></section>
<section class="card"><h3>حالة تسجيل اليوم</h3><div class="notice">${missing.length?'لم تسجل بيانات اليوم: '+missing.map(b=>esc(b.name)).join('، '):'كل الفروع سجلت بيانات اليوم ✓'}</div></section>
<section class="card"><h3>مقارنة الفروع</h3><div class="table-wrap"><table><thead><tr><th>الفرع</th>${TYPES.map(([,l])=>'<th>'+l+'</th>').join('')}<th>الإجمالي</th><th>حالة اليوم</th></tr></thead><tbody>${all.map(b=>'<tr><td>'+esc(b.name)+'</td>'+TYPES.map(([k])=>'<td>'+b.v[k]+'</td>').join('')+'<td><b>'+total(b.v)+'</b></td><td><span class="pill '+(b.submittedToday?'ok':'no')+'">'+(b.submittedToday?'سجّل':'لم يسجّل')+'</span></td></tr>').join('')||'<tr><td colspan="13">لا توجد فروع</td></tr>'}</tbody></table></div></section>
<section class="card"><h3>ملخص الأيام</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th>${TYPES.map(([,l])=>'<th>'+l+'</th>').join('')}<th>الإجمالي</th></tr></thead><tbody>${sortedDays.map(d=>'<tr><td>'+esc(d)+'</td>'+TYPES.map(([k])=>'<td>'+daily[d][k]+'</td>').join('')+'<td><b>'+total(daily[d])+'</b></td></tr>').join('')||'<tr><td colspan="13">لا توجد تسجيلات في الفترة المحددة</td></tr>'}</tbody></table></div></section>`}
async function route(){nav();if(branch&&sessionStorage.getItem('ac_branch_pin'))renderBranch();else renderBranchPicker()}
window.addEventListener('hashchange',route);route();
