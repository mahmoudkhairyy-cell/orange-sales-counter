<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عدّاد المبيعات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#f4f4f4;color:#111}
header{background:#ff7900;color:#fff;padding:14px 16px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;font-size:14px;font-weight:400;cursor:pointer;text-decoration:underline}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccc;width:100%;margin:6px 0}
button{background:#ff7900;color:#fff;border:0;font-weight:700;cursor:pointer}
button.sec{background:#111}button.small{width:auto;padding:6px 10px;margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.big{font-size:56px;font-weight:800;color:#ff7900;text-align:center;line-height:1}
.lbl{text-align:center;color:#555;margin-bottom:8px}
.btns{display:flex;gap:10px}.btns button{font-size:24px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 4px;text-align:center;border-bottom:1px solid #eee}th{background:#fff3e6}
td:first-child,th:first-child{text-align:right}.team{background:#111;color:#fff;font-weight:700}
.err{color:#c00;min-height:20px}.hide{display:none}
</style>
</head>
<body>
<header><span>عدّاد المبيعات</span><span id="nav"></span></header>
<main id="app"></main>
<script>
const URL_='https://fjhjqrgolqqtaokrlezd.supabase.co',KEY='sb_publishable_6cLV7KQHG3RNeAenIUcKFg_qpWHumZq';
async function rpc(fn,args){
  const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||'خطأ في الاتصال');
  return j;
}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cairoToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
let me=JSON.parse(localStorage.getItem('ac_me')||'null');
function nav(){ $('#nav').innerHTML=location.hash==='#manager'?'<a href="#">المندوب</a>':'<a href="#manager">المدير</a>'; }
async function pickRep(){
  app.innerHTML='<div class="card"><h3>اختار اسمك</h3><select id="sel"><option value="">...</option></select><button id="go">دخول</button><div class="err" id="e"></div></div><div class="card"><h3>أول مرة؟ سجّل نفسك</h3><input id="nm" placeholder="الاسم"><input id="tm" placeholder="اسم الفريق / الفرع"><button class="sec" id="add">تسجيل</button></div>';
  try{const reps=await rpc('ac_list_reps');
    $('#sel').innerHTML='<option value="">اختار...</option>'+reps.map(r=>`<option value="${r.id}" data-n="${esc(r.name)}" data-t="${esc(r.team)}">${esc(r.team)} - ${esc(r.name)}</option>`).join('');
  }catch(e){$('#e').textContent=e.message}
  $('#go').onclick=()=>{const o=$('#sel').selectedOptions[0];if(!o||!o.value){$('#e').textContent='اختار اسمك';return}
    me={id:o.value,name:o.dataset.n,team:o.dataset.t};localStorage.setItem('ac_me',JSON.stringify(me));rep()};
  $('#add').onclick=async()=>{try{const n=$('#nm').value.trim(),t=$('#tm').value.trim();if(!n||!t){$('#e').textContent='اكتب الاسم والفريق';return}
    const id=await rpc('ac_add_rep',{p_name:n,p_team:t});me={id,name:n,team:t};localStorage.setItem('ac_me',JSON.stringify(me));rep()}catch(e){$('#e').textContent=e.message}};
}
async function rep(){
  if(!me)return pickRep();
  app.innerHTML=`<div class="card"><div class="row"><b>${esc(me.name)} - ${esc(me.team)}</b><button class="small sec" id="out">تغيير</button></div></div>
  <div class="card"><div class="lbl">تفعيلات الخطوط النهاردة</div><div class="big" id="a">0</div><div class="btns"><button data-k="a" data-d="1">+1</button><button class="sec" data-k="a" data-d="-1">-1</button></div></div>
  <div class="card"><div class="lbl">العقود النهاردة</div><div class="big" id="c">0</div><div class="btns"><button data-k="c" data-d="1">+1</button><button class="sec" data-k="c" data-d="-1">-1</button></div></div>
  <div class="card"><div class="lbl">آخر الأيام</div><table><thead><tr><th>اليوم</th><th>تفعيلات</th><th>عقود</th></tr></thead><tbody id="h"></tbody></table><div class="err" id="e"></div></div>`;
  $('#out').onclick=()=>{localStorage.removeItem('ac_me');me=null;pickRep()};
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{
    const d=+b.dataset.d;await rpc('ac_bump',{p_rep:me.id,p_act:b.dataset.k==='a'?d:0,p_con:b.dataset.k==='c'?d:0});await load()}catch(e){$('#e').textContent=e.message}b.disabled=false});
  load();
  async function load(){try{const rows=await rpc('ac_my',{p_rep:me.id});const t=cairoToday();const today=rows.find(r=>r.day===t)||{activations:0,contracts:0};
    $('#a').textContent=today.activations;$('#c').textContent=today.contracts;
    $('#h').innerHTML=rows.map(r=>`<tr><td>${r.day}</td><td>${r.activations}</td><td>${r.contracts}</td></tr>`).join('')||'<tr><td colspan=3>لسه مفيش</td></tr>'}catch(e){$('#e').textContent=e.message}}
}
function manager(){
  app.innerHTML='<div class="card"><h3>دخول المدير</h3><input type="password" id="pw" placeholder="الباسورد"><button id="ok">دخول</button><div class="err" id="e"></div></div><div id="rep"></div>';
  $('#ok').onclick=()=>show($('#pw').value);
}
async function show(pw,range){
  range=range||'today';const t=cairoToday();let from=t;
  if(range==='week'){const d=new Date(t+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-6);from=d.toISOString().slice(0,10)}
  if(range==='month'){from=t.slice(0,8)+'01'}
  try{const rows=await rpc('ac_manager_report',{p_password:pw,p_from:from,p_to:t});
    const reps={};rows.forEach(r=>{const x=reps[r.rep_id]||(reps[r.rep_id]={id:r.rep_id,name:r.name,team:r.team,a:0,c:0});x.a+=r.activations||0;x.c+=r.contracts||0});
    const teams={};Object.values(reps).forEach(r=>(teams[r.team]=teams[r.team]||[]).push(r));
    let A=0,C=0,h='';
    Object.keys(teams).sort().forEach(tn=>{let ta=0,tc=0;let body='';teams[tn].forEach(r=>{ta+=r.a;tc+=r.c;body+=`<tr><td>${esc(r.name)}</td><td>${r.a}</td><td>${r.c}</td><td><button class="small sec" data-del="${r.id}">x</button></td></tr>`});
      A+=ta;C+=tc;h+=`<tr class="team"><td>${esc(tn)}</td><td>${ta}</td><td>${tc}</td><td></td></tr>`+body});
    $('#rep').innerHTML=`<div class="card"><div class="btns"><button class="${range==='today'?'':'sec'}" data-r="today">النهاردة</button><button class="${range==='week'?'':'sec'}" data-r="week">7 أيام</button><button class="${range==='month'?'':'sec'}" data-r="month">الشهر</button></div></div>
    <div class="card"><div class="row"><div class="lbl">إجمالي التفعيلات<div class="big">${A}</div></div><div class="lbl">إجمالي العقود<div class="big">${C}</div></div></div></div>
    <div class="card"><table><thead><tr><th>المندوب</th><th>تفعيلات</th><th>عقود</th><th></th></tr></thead><tbody>${h||'<tr><td colspan=4>مفيش مندوبين</td></tr>'}</tbody></table></div>`;
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>show(pw,b.dataset.r));
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('مسح المندوب وكل أرقامه؟')){await rpc('ac_manager_delete_rep',{p_password:pw,p_rep:b.dataset.del});show(pw,range)}});
    const e=$('#e');if(e)e.textContent='';
  }catch(e){const el=$('#e');if(el)el.textContent=/wrong password/.test(e.message)?'الباسورد غلط':e.message}
}
function route(){nav();location.hash==='#manager'?manager():rep()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
