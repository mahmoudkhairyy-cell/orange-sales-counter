<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مبيعات الفروع اليومية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#f4f4f4;color:#111}
header{background:#ff7900;color:#fff;padding:14px 16px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;font-size:14px;font-weight:400;cursor:pointer;text-decoration:underline}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccc;width:100%;margin:5px 0}
button{background:#ff7900;color:#fff;border:0;font-weight:700;cursor:pointer}
button.sec{background:#111}button.small{width:auto;padding:6px 10px;margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:4px 0}
.f label{flex:1;font-weight:600}.f input{width:110px;text-align:center;font-size:20px;margin:2px 0}
.tot{font-size:30px;font-weight:800;color:#ff7900;text-align:center}
.btns{display:flex;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 3px;text-align:center;border-bottom:1px solid #eee}th{background:#fff3e6}
td:first-child,th:first-child{text-align:right}.area{background:#111;color:#fff;font-weight:700}
.err{color:#c00;min-height:20px}.ok{color:#0a7a2f;font-weight:700;min-height:20px}.warn{background:#fff3e6;border-right:4px solid #ff7900}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><span>مبيعات الفروع اليومية</span><span id="nav"></span></header>
<main id="app"></main>
<script>
const URL_='https://fjhjqrgolqqtaokrlezd.supabase.co',KEY='sb_publishable_6cLV7KQHG3RNeAenIUcKFg_qpWHumZq';
const TYPES=[['alo','ALO'],['control','Control'],['postpaid','Postpaid'],['dataline','Data line'],['corporate','Corporate'],['mnp','MNP'],['migration','Migration'],['adsl','ADSL'],['simswap','SIM Swap'],['cleansing','Data Cleansing & Gathering']];
async function rpc(fn,args){
  const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||'خطأ في الاتصال');
  return j;
}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cairoToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
const sum=v=>TYPES.reduce((a,[k])=>a+(+(v&&v[k])||0),0);
let me=JSON.parse(localStorage.getItem('ac_branch')||'null');
function nav(){ $('#nav').innerHTML=location.hash==='#manager'?'<a href="#">الفرع</a>':'<a href="#manager">المدير</a>'; }
async function pick(){
  app.innerHTML='<div class="card"><h3>اختار الفرع</h3><select id="sel"><option value="">...</option></select><button id="go">دخول</button><div class="err" id="e"></div></div><div class="card"><h3>فرع جديد؟ سجّله</h3><input id="nm" placeholder="اسم الفرع"><input id="ar" placeholder="المنطقة"><button class="sec" id="add">تسجيل</button></div>';
  try{const bs=await rpc('ac_list_branches');
    $('#sel').innerHTML='<option value="">اختار...</option>'+bs.map(b=>`<option value="${b.id}" data-n="${esc(b.name)}" data-a="${esc(b.area)}">${esc(b.area)} - ${esc(b.name)}</option>`).join('');
  }catch(e){$('#e').textContent=e.message}
  const set=(id,n,a)=>{me={id,name:n,area:a};localStorage.setItem('ac_branch',JSON.stringify(me));branch()};
  $('#go').onclick=()=>{const o=$('#sel').selectedOptions[0];if(!o||!o.value){$('#e').textContent='اختار الفرع';return}set(o.value,o.dataset.n,o.dataset.a)};
  $('#add').onclick=async()=>{try{const n=$('#nm').value.trim(),a=$('#ar').value.trim();if(!n||!a){$('#e').textContent='اكتب اسم الفرع والمنطقة';return}
    set(await rpc('ac_add_branch',{p_name:n,p_area:a}),n,a)}catch(e){$('#e').textContent=e.message}};
}
async function branch(){
  if(!me)return pick();
  const t=cairoToday();let days=[];
  app.innerHTML=`<div class="card"><div class="row"><b>${esc(me.name)} - ${esc(me.area)}</b><button class="small sec" id="out">تغيير</button></div></div>
  <div class="card"><label>اليوم</label><input type="date" id="day" value="${t}" max="${t}"><div id="fields"></div>
  <div class="f"><label>الإجمالي</label><div class="tot" id="tot">0</div></div>
  <button id="save">حفظ</button><div class="ok" id="m"></div><div class="err" id="e"></div></div>
  <div class="card"><b id="ptl">إجمالي الفترة</b><div class="scroll"><table><thead><tr>${TYPES.map(([k,l])=>`<th>${l}</th>`).join('')}<th>الإجمالي</th></tr></thead><tbody id="pt"></tbody></table></div></div>
  <div class="card"><b>آخر الأيام</b><div class="scroll"><table><thead><tr><th>اليوم</th><th>الإجمالي</th></tr></thead><tbody id="h"></tbody></table></div></div>`;
  $('#fields').innerHTML=TYPES.map(([k,l])=>`<div class="f"><label>${l}</label><input type="number" inputmode="numeric" min="0" id="f_${k}" placeholder="0"></div>`).join('');
  const calc=()=>{$('#tot').textContent=TYPES.reduce((a,[k])=>a+(+$('#f_'+k).value||0),0)};
  TYPES.forEach(([k])=>$('#f_'+k).oninput=calc);
  const fill=()=>{const d=days.find(x=>x.day===$('#day').value);TYPES.forEach(([k])=>{$('#f_'+k).value=d&&d.v[k]?d.v[k]:''});calc();$('#m').textContent=d?'فيه بيانات محفوظة للنهاردة، تقدر تعدلها':''};
  $('#day').onchange=fill;
  $('#out').onclick=()=>{localStorage.removeItem('ac_branch');me=null;pick()};
  function period(){const d=$('#day').value||t;const p1=+d.slice(8)<=15;const a=d.slice(0,8)+(p1?'01':'16'),b=d.slice(0,8)+(p1?'15':'31');
    const v={};days.filter(x=>x.day>=a&&x.day<=b).forEach(x=>TYPES.forEach(([k])=>v[k]=(v[k]||0)+(+x.v[k]||0)));
    $('#ptl').textContent='إجمالي الفترة '+(p1?'1 - 15':'16 - آخر الشهر')+' ('+d.slice(0,7)+')';
    $('#pt').innerHTML='<tr>'+TYPES.map(([k])=>`<td>${v[k]||0}</td>`).join('')+`<td><b>${sum(v)}</b></td></tr>`}
  $('#day').addEventListener('change',period);
  async function load(){try{days=await rpc('ac_get_days',{p_branch:me.id});fill();period();
    $('#h').innerHTML=days.map(r=>`<tr><td>${r.day}</td><td>${sum(r.v)}</td></tr>`).join('')||'<tr><td colspan=2>لسه مفيش</td></tr>'}catch(e){$('#e').textContent=e.message}}
  $('#save').onclick=async()=>{const v={};TYPES.forEach(([k])=>v[k]=+$('#f_'+k).value||0);$('#e').textContent='';
    try{await rpc('ac_save_day',{p_branch:me.id,p_day:$('#day').value,p_v:v});await load();$('#m').textContent='تم الحفظ ✓'}catch(e){$('#e').textContent=e.message}};
  load();
}
function manager(){
  app.innerHTML='<div class="card"><h3>دخول المدير</h3><input type="password" id="pw" placeholder="الباسورد"><button id="ok">دخول</button><div class="err" id="e"></div></div><div id="rep"></div>';
  $('#ok').onclick=()=>show($('#pw').value);
}
async function show(pw,range,mo){
  range=range||'today';const t=cairoToday();mo=mo||t.slice(0,7);let from=t,to=t;
  const [Y,M]=mo.split('-').map(Number);const last=new Date(Date.UTC(Y,M,0)).getUTCDate();const ml=n=>mo+'-'+String(n).padStart(2,'0');
  if(range==='week'){const d=new Date(t+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-6);from=d.toISOString().slice(0,10)}
  if(range==='p1'){from=ml(1);to=ml(15)}
  if(range==='p2'){from=ml(16);to=ml(last)}
  if(range==='month'){from=ml(1);to=ml(last)}
  try{const rows=await rpc('ac_mgr_report',{p_password:pw,p_from:from,p_to:to});
    const bs={};rows.forEach(r=>{const x=bs[r.branch_id]||(bs[r.branch_id]={id:r.branch_id,name:r.name,area:r.area,v:{},today:false});
      if(r.day){TYPES.forEach(([k])=>x.v[k]=(x.v[k]||0)+(+r.v[k]||0));if(r.day===t)x.today=true}});
    const all=Object.values(bs);
    if(range!=='today'||true){const tr=await rpc('ac_mgr_report',{p_password:pw,p_from:t,p_to:t});const s={};tr.forEach(r=>{if(r.day)s[r.branch_id]=1});all.forEach(b=>b.today=!!s[b.id])}
    const tot={};TYPES.forEach(([k])=>tot[k]=all.reduce((a,b)=>a+(b.v[k]||0),0));
    const areas={};all.forEach(b=>(areas[b.area]=areas[b.area]||[]).push(b));
    const missing=all.filter(b=>!b.today);
    const head='<tr><th>الفرع</th>'+TYPES.map(([k,l])=>`<th>${l}</th>`).join('')+'<th>الإجمالي</th><th></th></tr>';
    let body='';Object.keys(areas).sort().forEach(a=>{const ar={};TYPES.forEach(([k])=>ar[k]=areas[a].reduce((s,b)=>s+(b.v[k]||0),0));
      body+=`<tr class="area"><td>${esc(a)}</td>${TYPES.map(([k])=>`<td>${ar[k]}</td>`).join('')}<td>${sum(ar)}</td><td></td></tr>`;
      areas[a].forEach(b=>body+=`<tr><td>${esc(b.name)}</td>${TYPES.map(([k])=>`<td>${b.v[k]||0}</td>`).join('')}<td><b>${sum(b.v)}</b></td><td><button class="small sec" data-del="${b.id}">x</button></td></tr>`)});
    $('#rep').innerHTML=`<div class="card"><div class="btns"><button class="${range==='today'?'':'sec'}" data-r="today">النهاردة</button><button class="${range==='week'?'':'sec'}" data-r="week">7 أيام</button></div><div class="btns"><button class="${range==='p1'?'':'sec'}" data-r="p1">فترة 1-15</button><button class="${range==='p2'?'':'sec'}" data-r="p2">فترة 16-آخر الشهر</button><button class="${range==='month'?'':'sec'}" data-r="month">الشهر كله</button></div><label>الشهر للفترات</label><input type="month" id="mo" value="${mo}"><div class="lbl">${from} → ${to}</div></div>
    <div class="card"><div class="lbl">إجمالي كل الفروع</div><div class="tot">${sum(tot)}</div><table><thead><tr>${TYPES.map(([k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody><tr>${TYPES.map(([k])=>`<td><b>${tot[k]}</b></td>`).join('')}</tr></tbody></table></div>
    <div class="card warn"><b>فروع لسه ماسلمتش النهاردة (${missing.length})</b><div>${missing.map(b=>esc(b.area)+' - '+esc(b.name)).join('<br>')||'الكل سلّم ✓'}</div></div>
    <div class="card scroll"><table><thead>${head}</thead><tbody>${body||'<tr><td colspan=13>مفيش فروع</td></tr>'}</tbody></table></div>`;
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>show(pw,b.dataset.r,$('#mo').value));
    $('#mo').onchange=()=>show(pw,/^(p1|p2|month)$/.test(range)?range:'p1',$('#mo').value);
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('مسح الفرع وكل أرقامه؟')){await rpc('ac_mgr_delete_branch',{p_password:pw,p_branch:b.dataset.del});show(pw,range,mo)}});
    const e=$('#e');if(e)e.textContent='';
  }catch(e){const el=$('#e');if(el)el.textContent=/wrong password/.test(e.message)?'الباسورد غلط':e.message}
}
function route(){nav();location.hash==='#manager'?manager():branch()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
