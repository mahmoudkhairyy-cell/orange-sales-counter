<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d85f00"><title>متابعة مستر عبدالرحمن</title>
<style>
:root{color-scheme:light;--orange:#f47700;--deep:#c95100;--cream:#fff3e6;--ink:#242424;--muted:#777;--line:#eee4da;--bg:#fffaf5;--green:#16794a;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,sans-serif;line-height:1.55}
header{background:linear-gradient(110deg,var(--deep),var(--orange));color:#fff;padding:18px 16px;box-shadow:0 4px 16px #9b43002b}
.brand{font-size:20px;font-weight:850}.sub{font-size:12px;opacity:.9}main{width:min(100%,1000px);margin:auto;padding:16px 14px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #7c3b0010}
h2,h3,p{margin-top:0}h2{font-size:19px;margin-bottom:4px}h3{font-size:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px}
.field{margin:9px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}
input,button{font:inherit;border-radius:10px;width:100%;padding:11px 12px;min-height:44px}
input{border:1px solid #ded6ce;background:#fff;color:var(--ink)}input:focus{outline:2px solid #ff790055;border-color:var(--orange)}
button{border:0;background:var(--orange);color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#282828}.light{background:var(--cream);color:var(--deep);border:1px solid #ffe0c1}.tiny{width:auto;min-height:34px;padding:5px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{background:linear-gradient(145deg,#fff8f0,#fff);border:1px solid #f4e4d4;border-radius:13px;padding:12px;text-align:center}.metric strong{display:block;font-size:25px;color:var(--deep);line-height:1.3}.metric span{font-size:12px;color:var(--muted)}
.total{font-size:34px;font-weight:900;color:var(--deep);text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.notice{padding:11px 12px;border-radius:11px;background:var(--cream);border-right:4px solid var(--orange);font-size:13px;margin:10px 0}
.error{color:var(--red);font-size:13px;min-height:20px}.success{color:var(--green);font-size:13px;min-height:20px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #f0ebe6}th{background:var(--cream);font-weight:850}td:first-child,th:first-child{text-align:right}tr:last-child td{border-bottom:0}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.branch-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.branch-card h3{margin:0 0 3px}.branch-card .mini{font-size:12px;color:var(--muted);margin-bottom:9px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
@media(min-width:650px){main{padding-top:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Executive dashboard visual refinement */
:root{--orange:#ed7100;--deep:#a94300;--cream:#fff1e2;--ink:#20242b;--muted:#68717d;--line:#e8e1d9;--bg:#f5f7fa}
body{background:linear-gradient(180deg,#fff7ed 0,#f5f7fa 360px);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(112deg,#963b00 0%,#df6500 55%,#ff9c38 100%);padding:19px max(18px,env(safe-area-inset-right));box-shadow:0 9px 28px #9b43002b}
.brand{font-size:21px;letter-spacing:-.3px}main{max-width:1080px;padding:22px 16px 56px}
.card{border-radius:19px;padding:19px;border-color:#e8e1d9;box-shadow:0 9px 30px #1720330b}
.metric{border-radius:15px;background:linear-gradient(145deg,#fff8f0,#fff);border-color:#f0dfcc;padding:14px}
.metric strong{font-size:27px}
button{border-radius:12px;box-shadow:0 3px 10px #9b430018;transition:transform .15s ease,filter .15s ease}
button:active{transform:translateY(1px);filter:brightness(.97)}
input{border-radius:12px}
.branch-card{border-radius:16px;padding:15px;box-shadow:0 5px 16px #17203308}
.table-wrap{border-radius:13px}
th{background:#fff1e2}
.notice{border-radius:13px}
@media(min-width:650px){.grid{gap:12px}.branch-grid{gap:13px}}

</style></head><body>
<header><div class="brand">متابعة مستر عبدالرحمن</div><div class="sub">لوحة تقارير الفروع · صلاحية مشاهدة فقط</div></header>
<main id="app"><section class="card">جاري التحميل...</section></main>
<script>
const SUPABASE_URL='https://fjhjqrgolqqtaokrlezd.supabase.co';
const SUPABASE_KEY='sb_publishable_6cLV7KQHG3RNeAenIUcKFg_qpWHumZq';
const TYPES=[['alo','ALO'],['control','Control'],['postpaid','Postpaid'],['dataline','Data line'],['corporate','Corporate'],['mnp','MNP'],['migration','Migration'],['adsl','ADSL'],['simswap','SIM Swap'],['cleansing','Data Cleansing & Gathering']];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const total=v=>TYPES.reduce((s,[k])=>s+(Number(v?.[k])||0),0);
const empty=()=>Object.fromEntries(TYPES.map(([k])=>[k,0]));
const sumExtra=(rows,k)=>rows.reduce((s,r)=>s+(Number(r.v?.[k])||0),0);
let viewerPassword=sessionStorage.getItem('ac_viewer_password')||'',viewerData=null,selectedBranchId='';
async function rpc(name,args={}){const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const data=await res.json().catch(()=>null);if(!res.ok)throw new Error(data?.message||data?.details||'تعذر الاتصال بالخدمة');if(data&&data.ok===false)throw new Error(({wrong:'كلمة المرور غير صحيحة أو تم إيقاف المحاولة مؤقتًا',weak_password:'كلمة المرور الجديدة يجب ألا تقل عن 8 أحرف',bad_range:'الفترة المحددة غير صحيحة'})[data.error]||data.error||'حدث خطأ');return data}
function loginScreen(message=''){viewerPassword='';sessionStorage.removeItem('ac_viewer_password');app.innerHTML=`<section class="card"><h2>تسجيل دخول مستر عبدالرحمن</h2><p class="muted">أدخل كلمة المرور لعرض تقارير الفروع السبعة.</p><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginBtn">دخول لوحة المتابعة</button><div class="error" id="loginError">${esc(message)}</div></section>`;$('#loginBtn').onclick=login;$('#loginPassword').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const p=$('#loginPassword').value,b=$('#loginBtn');b.disabled=true;try{await rpc('ac_viewer_check',{p_password:p});viewerPassword=p;sessionStorage.setItem('ac_viewer_password',p);renderApp()}catch(e){$('#loginError').textContent=e.message}finally{b.disabled=false}}
async function viewerCall(from,to){return rpc('ac_viewer_data',{p_password:viewerPassword,p_from:from,p_to:to})}
function renderApp(){if(!viewerPassword)return loginScreen();const t=today();app.innerHTML=`<section class="card"><div class="row"><div><h2>تقرير أداء الفروع</h2><div class="muted">عرض ومقارنة تفاصيل كل فرع دون أي صلاحيات تعديل</div></div><button class="tiny secondary" id="logout">خروج</button></div><div class="notice">يمكنك اختيار أي فرع لعرض أرقامه اليومية وتفاصيل العقود والمبيعات.</div></section>
<section class="card"><h3>الفترة المطلوبة</h3><div class="grid"><div class="field"><label>من</label><input id="from" type="date" value="${t.slice(0,7)}-01"></div><div class="field"><label>إلى</label><input id="to" type="date" value="${t}"></div></div><button id="refresh">تحديث التقرير</button><div class="error" id="reportError"></div></section>
<div id="report"></div>
<section class="card"><h3>تغيير كلمة المرور</h3><p class="muted">غيّر كلمة مرور الدخول في أي وقت. يلزم إدخال كلمة المرور الحالية.</p><div class="field"><label>كلمة المرور الحالية</label><input id="oldPassword" type="password" autocomplete="current-password"></div><div class="grid"><div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password"></div><div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="confirmPassword" type="password" autocomplete="new-password"></div></div><button id="changePassword">حفظ كلمة المرور الجديدة</button><div class="success" id="passwordSuccess"></div><div class="error" id="passwordError"></div></section>`;
$('#logout').onclick=()=>loginScreen();$('#refresh').onclick=loadReport;$('#changePassword').onclick=changePassword;loadReport()}
async function changePassword(){const old=$('#oldPassword').value,n=$('#newPassword').value,c=$('#confirmPassword').value;if(n.length<8){$('#passwordError').textContent='كلمة المرور الجديدة يجب ألا تقل عن 8 أحرف';return}if(n!==c){$('#passwordError').textContent='تأكيد كلمة المرور غير مطابق';return}const b=$('#changePassword');b.disabled=true;$('#passwordError').textContent='';$('#passwordSuccess').textContent='';try{await rpc('ac_viewer_set_password',{p_password:old,p_new:n});viewerPassword=n;sessionStorage.setItem('ac_viewer_password',n);$('#oldPassword').value='';$('#newPassword').value='';$('#confirmPassword').value='';$('#passwordSuccess').textContent='تم تغيير كلمة المرور بنجاح ✓'}catch(e){$('#passwordError').textContent=e.message}finally{b.disabled=false}}
async function loadReport(){const from=$('#from').value,to=$('#to').value;if(!from||!to||from>to){$('#reportError').textContent='راجع تاريخ بداية ونهاية التقرير';return}const b=$('#refresh');b.disabled=true;$('#reportError').textContent='';try{const [data,todayData]=await Promise.all([viewerCall(from,to),viewerCall(today(),today())]);viewerData={...data,todayEntries:todayData.entries||[]};if(!selectedBranchId&&data.branches?.length)selectedBranchId=data.branches[0].id;drawReport(viewerData,from,to)}catch(e){$('#reportError').textContent=e.message;if(e.message.includes('كلمة المرور'))loginScreen(e.message)}finally{b.disabled=false}}
function drawReport(data,from,to){const branches=data.branches||[],entries=data.entries||[],todayEntries=data.todayEntries||[],byId={};branches.forEach(b=>byId[b.id]={...b,v:empty(),submittedToday:false,days:[]});entries.forEach(r=>{const b=byId[r.branch_id];if(!b)return;TYPES.forEach(([k])=>b.v[k]+=Number(r.v?.[k])||0);b.days.push(r)});todayEntries.forEach(r=>{if(byId[r.branch_id])byId[r.branch_id].submittedToday=true});const all=Object.values(byId),totals=empty();all.forEach(b=>TYPES.forEach(([k])=>totals[k]+=b.v[k]));const selected=byId[selectedBranchId]||all[0];if(selected)selectedBranchId=selected.id;const daily={};entries.forEach(r=>{daily[r.day]??=empty();TYPES.forEach(([k])=>daily[r.day][k]+=Number(r.v?.[k])||0)});const sorted=Object.keys(daily).sort().reverse();const branchCards=all.map(b=>`<div class="branch-card"><h3>${esc(b.name)}</h3><div class="grid"><div><b>${sumExtra(b.days,'contracts_count')}</b><div class="muted">العقود</div></div><div><b>${sumExtra(b.days,'sales_count')}</b><div class="muted">المبيعات</div></div><div><b>${total(b.v)}</b><div class="muted">إجمالي الأنواع</div></div><div><span class="pill ${b.submittedToday?'ok':'no'}">${b.submittedToday?'سجّل اليوم':'لم يسجّل اليوم'}</span></div></div><button class="light" style="margin-top:10px" data-branch="${esc(b.id)}">عرض تفاصيل الفرع</button></div>`).join('');const selectedDays=(selected?.days||[]).slice().sort((a,b)=>b.day.localeCompare(a.day));const detail=selected?`<section class="card"><div class="section-title"><div><h3>${esc(selected.name)}</h3><div class="muted">تفاصيل الفترة المحددة</div></div><span class="pill ok">مشاهدة فقط</span></div><div class="grid"><div class="metric"><strong>${sumExtra(selected.days,'contracts_count')}</strong><span>عدد العقود</span></div><div class="metric"><strong>${sumExtra(selected.days,'sales_count')}</strong><span>عدد المبيعات</span></div><div class="metric"><strong>${total(selected.v)}</strong><span>إجمالي الأنواع</span></div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>التاريخ</th><th>العقود</th><th>المبيعات</th><th>إجمالي الأنواع</th></tr></thead><tbody>${selectedDays.map(r=>`<tr><td>${esc(r.day)}</td><td>${Number(r.v?.contracts_count)||0}</td><td>${Number(r.v?.sales_count)||0}</td><td><b>${total(r.v)}</b></td></tr>`).join('')||'<tr><td colspan="4">لا توجد بيانات في الفترة</td></tr>'}</tbody></table></div><h3 style="margin-top:16px">تفاصيل أنواع المبيعات حسب اليوم</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th>${TYPES.map(([,l])=>'<th>'+l+'</th>').join('')}</tr></thead><tbody>${selectedDays.map(r=>'<tr><td>'+esc(r.day)+'</td>'+TYPES.map(([k])=>'<td>'+(Number(r.v?.[k])||0)+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="11">لا توجد بيانات</td></tr>'}</tbody></table></div></section>`:'';
$('#report').innerHTML=`<section class="card"><div class="muted">${esc(from)} ← ${esc(to)}</div><div class="total">${total(totals)}</div><div class="muted" style="text-align:center">إجمالي الأنواع في كل الفروع · ${all.length} فروع</div><div class="grid" style="margin-top:12px">${TYPES.map(([k,l])=>`<div class="metric"><strong>${totals[k]}</strong><span>${l}</span></div>`).join('')}<div class="metric"><strong>${sumExtra(entries,'contracts_count')}</strong><span>عدد العقود</span></div><div class="metric"><strong>${sumExtra(entries,'sales_count')}</strong><span>عدد المبيعات</span></div></div></section>
<section class="card"><h3>اختيار الفرع</h3><div class="branch-grid">${branchCards}</div></section>${detail}
<section class="card"><h3>ملخص الأيام على مستوى كل الفروع</h3><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>العقود</th><th>المبيعات</th><th>إجمالي الأنواع</th></tr></thead><tbody>${sorted.map(d=>{const dayRows=entries.filter(r=>r.day===d);return '<tr><td>'+esc(d)+'</td><td>'+sumExtra(dayRows,'contracts_count')+'</td><td>'+sumExtra(dayRows,'sales_count')+'</td><td><b>'+total(daily[d])+'</b></td></tr>'}).join('')||'<tr><td colspan="4">لا توجد تسجيلات في الفترة المحددة</td></tr>'}</tbody></table></div></section>`;
document.querySelectorAll('[data-branch]').forEach(btn=>btn.onclick=()=>{selectedBranchId=btn.dataset.branch;drawReport(data,from,to);document.querySelector('#report section:nth-of-type(3)')?.scrollIntoView({behavior:'smooth',block:'start'})})}
async function boot(){if(!viewerPassword)return loginScreen();try{await rpc('ac_viewer_check',{p_password:viewerPassword});renderApp()}catch(e){loginScreen(e.message)}}
boot();
</script></main></body></html>
